name: Build RIDA OS ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build RIDA OS ISO Image inside Debian Bookworm Container
        run: |
          docker build -t rida-builder -f builder/Dockerfile.builder .
          mkdir -p output
          docker run --rm --privileged -v ${{ github.workspace }}:/workspace rida-builder

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rida-os-1.0-amd64
          path: |
            output/rida-os-1.0-amd64.iso
            output/rida-os-1.0-amd64.iso.sha256
          retention-days: 14
